[package]
name = "deepcuts-sing"
version = "0.1.0"
edition = "2021"
description = "Sing deepcuts karaoke in the terminal: plays the karaoke stem with word-by-word lyrics."
license = "MIT"

[[bin]]
name = "deepcuts-sing"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
font8x8 = "0.3"
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ratatui = "0.29"
rodio = { version = "0.20", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
